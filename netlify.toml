# Netlify Production Configuration for MediOps Intelligence
# Live Site: https://mediops-intelligence.netlify.app

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "/api/v1"

# SPA deep-link fallback for React Router (/api/v1/* is served by netlify/functions/api.mjs)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
