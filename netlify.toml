# Netlify serves ONLY the static React build. There are NO Netlify Functions and NO mock API:
# every request goes from the browser directly to the live FastAPI backend on Render
# (https://careops-api-oi3h.onrender.com/api/v1), configured via VITE_API_BASE_URL.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://careops-api-oi3h.onrender.com/api/v1"

# SPA deep-link fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
