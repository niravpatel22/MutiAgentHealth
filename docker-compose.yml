# Local stack. Usage: docker compose up --build
# Runs db (PostgreSQL 16), api (FastAPI), worker (CrewAI queue runner), and frontend (React SPA).
name: careops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      POSTGRES_DB: healthcare_bi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare -d healthcare_bi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://healthcare:healthcare@db:5432/healthcare_bi
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://healthcare:healthcare@db:5432/healthcare_bi
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  pgdata:
