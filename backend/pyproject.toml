[project]
name = "mediops-backend"
version = "2.0.0"
description = "MediOps Intelligence - Hospital Operations & Performance Intelligence API (FastAPI + CrewAI + Gemini + PostgreSQL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "pandas>=2.2",
    "numpy>=2.1",
    "openpyxl>=3.1.5",
    "crewai[google-genai]==1.15.41",
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "black>=25.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live_llm: opt-in integration test hitting the live Gemini LLM"]
filterwarnings = ["ignore::DeprecationWarning"]
