name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_bi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_bi"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://healthcare:healthcare@localhost:5432/healthcare_bi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pytest --cov=app --cov-report=term-missing -m "not live_llm"

  frontend:
    name: Frontend (lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pip-audit (locked runtime + dev deps)
        working-directory: backend
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx --python 3.12 pip-audit --no-deps --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            -r /tmp/requirements.txt
      - name: npm audit (production dependencies, blocking)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev/build tooling, report only; see docs/DECISIONS.md D-016)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::dev-tooling advisories present (see DECISIONS.md D-016)"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.24.0 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  docker:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: careops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
