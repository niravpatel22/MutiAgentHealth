# Render Blueprint for MediOps Intelligence (100% Free-Tier Compatible: Postgres + API/Worker + React Static SPA)
# One-Click Deploy URL: https://dashboard.render.com/blueprint/new?repo=https://github.com/niravpatel22/MutiAgentHealth

databases:
  - name: careops-db
    databaseName: healthcare_bi
    user: healthcare
    plan: free

services:
  - type: web
    name: careops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: MediOps Intelligence
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: careops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://careops-web.onrender.com,http://localhost:5173
      - key: ADMIN_EMAIL
        value: admin@mediops.example
      - key: ADMIN_PASSWORD
        value: Admin#MediOps2026!
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: LLM_API_KEY
        value: ""

  - type: web
    name: careops-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careops-api.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
