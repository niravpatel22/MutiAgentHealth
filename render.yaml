# Render Blueprint for MediOps Intelligence (FastAPI + CrewAI + Neon PostgreSQL + React SPA)
# All secrets (DATABASE_URL, DATABASE_URL_UNPOOLED, LLM_API_KEY, ADMIN_PASSWORD, JWT_SECRET)
# are configured via Render Environment Variables (`sync: false`) and never hardcoded in git.

services:
  - type: web
    name: careops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: MediOps Intelligence
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: https://mediops-intelligence.netlify.app,https://careops-web-uk4b.onrender.com,https://careops-web.onrender.com,http://localhost:5173
      - key: ADMIN_EMAIL
        value: admin@mediops.example
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODEL
        value: gemini/gemini-3-flash-preview
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: careops-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careops-api-oi3h.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
