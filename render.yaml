# Render Blueprint for CareOps Intelligence
# Deploy at: https://dashboard.render.com/blueprints -> New Blueprint Instance
# Connect repository: https://github.com/niravpatel22/MutiAgentHealth

databases:
  - name: careops-db
    databaseName: healthcare_bi
    user: healthcare
    plan: free

services:
  - type: web
    name: careops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: careops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false

  - type: worker
    name: careops-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: careops-db
          property: connectionString
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
